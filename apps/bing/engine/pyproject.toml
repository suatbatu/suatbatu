[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bing-engine"
version = "1.0.0"
description = "Bing — a Fing-like network scanner engine (pure standard library)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Bing" }]
keywords = ["network", "scanner", "fing", "nmap", "discovery", "ports", "dns", "lan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
# No runtime dependencies — everything uses the standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/suatbatu/suatbatu"

[project.scripts]
bing = "bing_engine.cli:main"

[tool.setuptools]
packages = ["bing_engine"]

[tool.setuptools.package-data]
bing_engine = ["web/*.html", "web/*.css", "web/*.js"]
