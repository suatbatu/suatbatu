; PillPilot — camera node (ESP32-CAM, AI-Thinker)
; Dumb by design: waits for an MQTT trigger, snaps a photo, pushes it to
; Telegram. Also serves an auth-protected snapshot on the LAN. No dosing logic.

[env:esp32cam]
; pioarduino platform = Arduino-ESP32 core 3.x (see dispenser/platformio.ini).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200

; PSRAM strongly recommended (needed for larger frame sizes).
board_build.psram = enabled
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
