; PillPilot — dispenser node
; Main ESP32: carousel, RTC/scheduler, sensors, secured web server, notifier.

[env:dispenser]
; pioarduino platform = Arduino-ESP32 core 3.x (required by the async libs below
; and the esp_task_wdt config API). The official platformio/espressif32 is still
; on core 2.x. See docs/SECURITY.md / README for details.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Async web server + TLS + CA bundle exceed the default 1.25 MB app slot.
; min_spiffs = 1.9 MB app (with OTA) + a small LittleFS partition for the UI.
board_build.partitions = min_spiffs.csv

lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.3.0
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/RTClib @ ^2.1.4
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; PubSubClient default max packet is too small for schedule payloads:
    -DMQTT_MAX_PACKET_SIZE=2048

; Upload the web UI (data/) to LittleFS with:  pio run -t uploadfs
