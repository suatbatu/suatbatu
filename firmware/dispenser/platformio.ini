; PillPilot — dispenser node
; Main ESP32: carousel, RTC/scheduler, sensors, secured web server, notifier.

[env:dispenser]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.3.0
    mathieucarbou/AsyncTCP @ ^3.2.0
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/RTClib @ ^2.1.4
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; PubSubClient default max packet is too small for schedule payloads:
    -DMQTT_MAX_PACKET_SIZE=2048

; Upload the web UI (data/) to LittleFS with:  pio run -t uploadfs
