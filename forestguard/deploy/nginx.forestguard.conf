# Optional TLS reverse proxy for ForestGuard.
# ForestGuard speaks plain HTTP on the LAN; terminate TLS here before exposing
# it beyond the local network. Use with certbot/Let's Encrypt or a self-signed
# cert. See docs/DEPLOYMENT.md and docs/SECURITY-style notes in the README.
#
#   sudo cp deploy/nginx.forestguard.conf /etc/nginx/sites-available/forestguard
#   sudo ln -s /etc/nginx/sites-available/forestguard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name forestguard.example.org;
    # Redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forestguard.example.org;

    ssl_certificate     /etc/letsencrypt/live/forestguard.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forestguard.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Small telemetry batches only; reject oversized bodies at the edge.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
