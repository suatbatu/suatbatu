; shot-timer — ESP32-S3 shooting-sports shot timer
;
; Build:   pio run
; Flash:   pio run -t upload
; Web UI:  pio run -t uploadfs      (uploads data/ to the LittleFS partition)
; Serial:  pio device monitor

[env:shottimer]
; pioarduino platform = Arduino-ESP32 core 3.x. Required: the firmware uses the
; ESP-IDF 5.x I2S "std" driver (driver/i2s_std.h) and the async web server below,
; neither of which work on the official platformio/espressif32 (still core 2.x).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv

; Pinned to git tags rather than registry names. A shot timer is a build-it-once
; project — pinning means the firmware you flash in two years is the firmware
; that was tested. The registry equivalents are esp32async/ESPAsyncWebServer,
; esp32async/AsyncTCP, bblanchon/ArduinoJson and olikraus/U8g2.
; AsyncTCP is listed first on purpose: ESPAsyncWebServer declares it as a
; dependency, and resolving it from the pin here keeps both halves on versions
; that were tested together.
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.6
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/olikraus/U8g2_Arduino.git#2.9.2

build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; The detector runs from a high-priority task; keep the Arduino loop out of its way.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
