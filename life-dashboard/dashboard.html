.week ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }

@media (max-width: 760px) {
  .week { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 0; }
  .week > li { padding: 0 14px; }
  .week > li:first-child { padding-left: 14px; }
  .week > li:nth-child(odd) { padding-left: 0; }
  .week > li:nth-child(even) { border-right: 0; padding-right: 0; }
}

/* ---------- Inbox ---------- */
.mail { list-style: none; margin: 0; padding: 0; }
.mail li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.mail li:last-child { border-bottom: 0; }
.mail .from { font-weight: 600; font-size: 13px; }
.mail .subj { grid-column: 1; font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.mail .when {
  grid-row: 1 / span 2;
  grid-column: 2;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.mail li.f-action .from::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--critical);
  margin-right: 7px;
  vertical-align: middle;
}
.mail li.f-watch .from::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--warn);
  margin-right: 7px;
  vertical-align: middle;
}
.mail li.f-done .from::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--line);
  margin-right: 7px;
  vertical-align: middle;
}

/* ---------- Footer ---------- */
.foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: baseline;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .04em;
}

a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .masthead { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .counters { flex-wrap: wrap; }
  .counter { flex: 1 1 auto; min-width: 92px; }
}
@media (max-width: 480px) {
  .wrap { padding: 20px 14px 56px; }
  .tl li { grid-template-columns: 50px 14px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<div class="wrap">
  <div class="stale" id="stale"></div>

  <header class="masthead">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="greeting"></h1>
    </div>
    <div class="counters" id="counters"></div>
  </header>

  <p class="briefing" id="briefing"></p>

  <div class="board">
    <div class="col">
      <section class="panel">
        <header><h2>Schedule</h2><span class="meta" id="sched-meta"></span></header>
        <div id="days"></div>
      </section>

      <section class="panel">
        <header><h2>Top priorities</h2><span class="meta">from tasks.md</span></header>
        <div class="body"><ul class="pri" id="pri"></ul></div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <header><h2>Needs you</h2><span class="meta" id="needs-meta"></span></header>
        <div class="body"><ul class="needs" id="needs"></ul></div>
      </section>

      <section class="panel">
        <header><h2>Deadline ledger</h2><span class="meta">days remaining</span></header>
        <div class="body" style="overflow-x:auto">
          <table class="ledger">
            <thead><tr><th>What</th><th class="num">Left</th></tr></thead>
            <tbody id="ledger"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <header><h2>Inbox</h2><span class="meta" id="inbox-meta"></span></header>
        <div class="body"><ul class="mail" id="mail"></ul></div>
      </section>
    </div>
  </div>

  <section class="panel">
    <header><h2>Week ahead</h2><span class="meta" id="week-meta"></span></header>
    <div class="body"><ul class="week" id="week"></ul></div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Day math on plain YYYY-MM-DD strings, so no timezone drift.
  const toUTC = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const daysBetween = (from, to) => Math.round((toUTC(to) - toUTC(from)) / 86400000);

  const base = DATA.today.date;

  /* ---- stale check: is the reader looking at this on a later day? ---- */
  const now = new Date();
  const realToday = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
  const drift = daysBetween(base, realToday);
  if (drift > 0) {
    $("stale").className = "stale on";
    $("stale").innerHTML =
      "<b>" + drift + (drift === 1 ? " day" : " days") + " old</b>" +
      "<span>This board was built for " + esc(DATA.today.label) +
      ". Countdowns below are counted from that morning.</span>";
  }

  /* ---- masthead ---- */
  const hour = now.getHours();
  const salute = hour < 5 ? "Still up" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  $("greeting").innerHTML = esc(salute) + ", <em>" + esc(DATA.owner) + "</em>.";
  $("eyebrow").innerHTML = [
    esc(DATA.today.label),
    "Week " + DATA.today.weekNumber,
    esc(DATA.tz)
  ].map(s => "<span>" + s + "</span>").join('<span class="dot">/</span>');

  $("counters").innerHTML = DATA.counters.map(c =>
    '<div class="counter tone-' + esc(c.tone) + '">' +
      '<span class="n">' + esc(c.value) + "</span>" +
      '<span class="l">' + esc(c.label) + "</span>" +
      (c.note ? '<span class="s">' + esc(c.note) + "</span>" : "") +
    "</div>"
  ).join("");

  $("briefing").innerHTML = DATA.briefing;   // trusted: written by the briefing agent

  /* ---- schedule ---- */
  const totalEvents = DATA.days.reduce((n, d) => n + d.events.length, 0);
  $("sched-meta").textContent = totalEvents + (totalEvents === 1 ? " event" : " events");

  $("days").innerHTML = DATA.days.map(day => {
    const head =
      '<div class="dayhead"><h3>' + esc(day.label) + "</h3>" +
      '<span class="cnt">' + (day.events.length || "—") + "</span></div>";

    if (!day.events.length) {
      return '<div class="day">' + head +
        '<p class="empty">' + esc(day.emptyNote || "Nothing scheduled.") + "</p></div>";
    }

    const rows = day.events.map(ev => {
      const bits = [];
      if (ev.where) {
        bits.push(ev.link
          ? '<a href="' + esc(ev.link) + '" target="_blank" rel="noopener">' + esc(ev.where) + "</a>"
          : esc(ev.where));
      }
      if (ev.with) bits.push(esc(ev.with));

      const chips = [];
      if (ev.calendar) chips.push('<span class="chip">' + esc(ev.calendar) + "</span>");
      if (ev.rsvp === "needsAction") chips.push('<span class="chip crit">no reply yet</span>');
      if (ev.rsvp === "accepted") chips.push('<span class="chip ok">accepted</span>');
      if (ev.rsvp === "organizer") chips.push('<span class="chip acc">you organise</span>');

      return '<li class="' + (ev.conflict ? "is-conflict" : "") + '">' +
          '<div class="time">' + esc(ev.start) + "<span>" + esc(ev.end) + "</span></div>" +
          '<div class="rail"></div>' +
          '<div class="what">' +
            '<div class="t">' + esc(ev.title) + "</div>" +
            (bits.length ? '<div class="d">' + bits.join(" · ") + "</div>" : "") +
            (chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "") +
            (ev.conflictNote ? '<div class="note">' + esc(ev.conflictNote) + "</div>" : "") +
          "</div>" +
        "</li>";
    }).join("");

    return '<div class="day">' + head + '<ul class="tl">' + rows + "</ul></div>";
  }).join("");

  /* ---- priorities ---- */
  $("pri").innerHTML = DATA.priorities.map(p => {
    const d = daysBetween(base, p.due);
    const when = d < 0 ? "overdue" : d === 0 ? "today" : d === 1 ? "tomorrow" : "in " + d + "d";
    return '<li class="p' + p.pri + '">' +
        '<span class="box"></span>' +
        '<span class="txt">' + esc(p.text) +
          (p.tag ? ' <span class="chip">' + esc(p.tag) + "</span>" : "") +
        "</span>" +
        '<span class="when">' + when + "</span>" +
      "</li>";
  }).join("");

  /* ---- ledger ---- */
  $("ledger").innerHTML = DATA.deadlines
    .slice()
    .sort((a, b) => toUTC(a.date) - toUTC(b.date))
    .map(x => {
      const d = daysBetween(base, x.date);
      const cls = d <= 1 ? "d-now" : d <= 7 ? "d-soon" : "d-far";
      const label = d < 0 ? "passed" : d === 0 ? "today" : d === 1 ? "day" : "days";
      const num = d <= 0 ? (x.startedToday ? "now" : (d === 0 ? "0" : String(d))) : String(d);
      return "<tr>" +
          '<td><div class="title">' + esc(x.title) +
            (x.unverified ? ' <span class="chip warn">confirm date</span>' : "") +
          "</div>" +
          (x.detail ? '<div class="det">' + esc(x.detail) + "</div>" : "") +
          "</td>" +
          '<td class="num d ' + cls + '">' + esc(num) + "<small>" + esc(label) + "</small></td>" +
        "</tr>";
    }).join("");

  /* ---- needs you ---- */
  $("needs-meta").textContent = DATA.needsYou.length + " open";
  $("needs").innerHTML = DATA.needsYou.map(n =>
    '<li class="sev-' + esc(n.severity) + '">' +
      '<span class="stripe"></span>' +
      "<div>" +
        '<div class="what">' + esc(n.what) + "</div>" +
        '<div class="why">' + esc(n.why) + "</div>" +
        '<div class="src">' + esc(n.source) + "</div>" +
      "</div>" +
    "</li>"
  ).join("");

  /* ---- week ---- */
  $("week-meta").textContent = DATA.weekAhead.length + " days";
  $("week").innerHTML = DATA.weekAhead.map(d =>
    '<li class="' + (d.items.length ? "busy" : "") + '">' +
      '<span class="dd">' + esc(d.label) + "</span>" +
      (d.items.length
        ? "<ul>" + d.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>"
        : '<span class="none">clear</span>') +
    "</li>"
  ).join("");

  /* ---- inbox ---- */
  $("inbox-meta").textContent = DATA.inbox.unreadEstimate + " " + DATA.inbox.windowLabel;
  $("mail").innerHTML = DATA.inbox.threads.map(t =>
    '<li class="f-' + esc(t.flag) + '">' +
      '<span class="from">' + esc(t.from) + "</span>" +
      '<span class="when">' + esc(t.when) + "</span>" +
      '<span class="subj">' + esc(t.subject) + "</span>" +
    "</li>"
  ).join("");

  /* ---- footer ---- */
  const gen = DATA.generatedAt.replace("T", " ").slice(0, 16);
  $("foot").innerHTML = [
    "Built " + esc(gen) + " " + esc(DATA.tz),
    "Sources: " + DATA.sources.map(esc).join(" · "),
    "Rebuilds every morning at 07:55"
  ].map(s => "<span>" + s + "</span>").join("");
})();
</script>
