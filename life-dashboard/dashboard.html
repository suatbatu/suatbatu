  font-size: 14.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.tl .what .d {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 2px;
}
.tl .what .d a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-wash); }
.tl .what .d a:hover { border-bottom-color: var(--accent); }
.tl .note {
  margin-top: 6px;
  font-size: 12px;
  padding: 7px 10px;
  border-radius: 2px;
  background: var(--critical-wash);
  color: var(--critical);
  border-left: 2px solid var(--critical);
}

.empty {
  margin: 2px 16px 18px;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 3px;
  color: var(--ink-soft);
  font-size: 13.5px;
  text-align: center;
  background: var(--ground);
}

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  background: var(--ground);
  white-space: nowrap;
}
.chip.acc  { color: var(--accent);   border-color: var(--accent);   background: var(--accent-wash); }
.chip.crit { color: var(--critical); border-color: var(--critical); background: var(--critical-wash); }
.chip.warn { color: var(--warn);     border-color: var(--warn);     background: var(--warn-wash); }
.chip.ok   { color: var(--clear);    border-color: var(--clear);    background: var(--clear-wash); }

/* ---------- Needs you ---------- */
.needs { list-style: none; margin: 0; padding: 0; }
.needs li {
  display: grid;
  grid-template-columns: 3px minmax(0, 1fr);
  gap: 0 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line-soft);
}
.needs li:last-child { border-bottom: 0; padding-bottom: 2px; }
.needs .stripe { background: var(--sev, var(--accent)); border-radius: 2px; }
.needs .what { font-weight: 600; font-size: 14px; line-height: 1.35; }
.needs .why  { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
.needs .src  {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--ink-faint);
  text-transform: uppercase;
  margin-top: 5px;
}
.sev-critical { --sev: var(--critical); }
.sev-warn     { --sev: var(--warn); }

/* ---------- Ledger ---------- */
.ledger { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ledger th {
  text-align: left;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 500;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.ledger th.num, .ledger td.num { text-align: right; }
.ledger td {
  padding: 11px 0;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}
.ledger tr:last-child td { border-bottom: 0; }
.ledger .d {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  padding-left: 14px;
}
.ledger .d small {
  display: block;
  font-weight: 400;
  font-size: 10px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.d-now  { color: var(--critical); }
.d-soon { color: var(--warn); }
.d-far  { color: var(--ink-soft); }
.ledger .title { font-weight: 600; line-height: 1.35; }
.ledger .det { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

/* One-click actions — squared to match the chips, not pills */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.act {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-soft);
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 2px;
  text-decoration: none;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.act:hover, .act:focus-visible {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-wash);
}
.act svg {
  width: 13px; height: 13px; flex: none;
  stroke: currentColor; fill: none;
  stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- Priorities ---------- */
.pri { list-style: none; margin: 0; padding: 0; }
.pri li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.pri li:last-child { border-bottom: 0; }
.pri .box {
  width: 13px; height: 13px;
  border: 1.5px solid var(--ink-faint);
  border-radius: 2px;
  align-self: center;
}
.pri li.p1 .box { border-color: var(--critical); }
.pri .txt { font-size: 13.5px; line-height: 1.4; }
.pri .when {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  color: var(--ink-faint);
  white-space: nowrap;
}
.pri li.p1 .when { color: var(--critical); }

/* ---------- Week: one column per day, so the week reads left to right ---------- */
.week {
  list-style: none;
  margin: 0;
  padding: 10px 0 2px;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.week > li {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 14px;
  border-right: 1px solid var(--line-soft);
  min-height: 78px;
}
.week > li:first-child { padding-left: 0; }
.week > li:last-child { border-right: 0; padding-right: 0; }
.week .dd {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}
.week > li.busy .dd { color: var(--accent); border-bottom-color: var(--accent); }
.week .none { color: var(--ink-faint); font-style: italic; font-size: 12.5px; }
.week ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.week ul li { font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .week { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 0; }
  .week > li { padding: 0 14px; }
  .week > li:first-child { padding-left: 14px; }
  .week > li:nth-child(odd) { padding-left: 0; }
  .week > li:nth-child(even) { border-right: 0; padding-right: 0; }
}

/* ---------- Inbox ---------- */
.mail { list-style: none; margin: 0; padding: 0; }
.mail li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line-soft);
}
.mail li:last-child { border-bottom: 0; }
.mail .from { font-weight: 600; font-size: 13px; }
.mail .subj { grid-column: 1; font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.mail .when {
  grid-row: 1 / span 2;
  grid-column: 2;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-faint);
  white-space: nowrap;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.mail li.f-action .from::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--critical);
  margin-right: 7px;
  vertical-align: middle;
}
.mail li.f-watch .from::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--warn);
  margin-right: 7px;
  vertical-align: middle;
}
.mail li.f-done .from::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--line);
  margin-right: 7px;
  vertical-align: middle;
}

/* ---------- Controls: refresh + full rebuild ---------- */
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 2px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: background .12s ease, border-color .12s ease, color .12s ease;
}
.btn:hover:not([disabled]), .btn:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-wash);
}
.btn[disabled] { opacity: .55; cursor: default; }
.btn svg {
  width: 14px; height: 14px; flex: none;
  stroke: currentColor; fill: none;
  stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.btn.busy svg { animation: spin 1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Freshness marker in a panel header */
.stamp {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--clear);
  text-transform: uppercase;
}
.stamp.morning { color: var(--ink-faint); }

/* "This panel wasn't refreshed" note */
.secnote {
  margin: 0 16px 14px;
  padding: 8px 11px;
  font-size: 11.5px;
  color: var(--ink-soft);
  background: var(--ground);
  border-left: 2px solid var(--line);
  border-radius: 2px;
}

/* Per-section failure — one per affected panel, never a page-wide catch-all */
.err {
  margin: 10px 0 2px;
  padding: 10px 12px;
  border-radius: 2px;
  font-size: 12.5px;
  background: var(--warn-wash);
  border-left: 2px solid var(--warn);
  color: var(--warn);
}
.err b { display: block; margin-bottom: 2px; }
.err a { color: inherit; }
#sched-err:not(:empty) { padding: 12px 16px 0; }

/* ---------- Task box ---------- */
.tb { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; width: fit-content; }
.seg button {
  padding: 6px 14px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  background: var(--surface);
  border: 0;
  border-right: 1px solid var(--line);
  cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tb-row { display: flex; gap: 8px; flex-wrap: wrap; }
.tb-row > * { min-width: 0; }
.tb input[type="text"], .tb select, .tb input[type="date"] {
  flex: 1 1 160px;
  padding: 8px 10px;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--line);
  border-radius: 2px;
}
.tb input[type="date"], .tb select.pri-sel { flex: 0 1 130px; }
.tb input:focus, .tb select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.tb-status { font-size: 12px; color: var(--ink-soft); min-height: 17px; }
.tb-status.ok { color: var(--clear); }
.tb-status.bad { color: var(--critical); }
.tb-hint { font-size: 11.5px; color: var(--ink-faint); }
.chip.pend { color: var(--warn); border-color: var(--warn); background: var(--warn-wash); }
.pri li.pending .txt { color: var(--ink-soft); }

/* ---------- Footer ---------- */
.foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  align-items: baseline;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .04em;
}

a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .masthead { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .counters { flex-wrap: wrap; }
  .counter { flex: 1 1 auto; min-width: 92px; }
}
@media (max-width: 480px) {
  .wrap { padding: 20px 14px 56px; }
  .tl li { grid-template-columns: 50px 14px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

      <section class="panel" id="taskbox-panel" hidden>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Day math on plain YYYY-MM-DD strings, so no timezone drift.
  const toUTC = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const daysBetween = (from, to) => Math.round((toUTC(to) - toUTC(from)) / 86400000);

  const base = DATA.today.date;

  /* ---- stale check: is the reader looking at this on a later day? ---- */
  const now = new Date();
  const realToday = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
  const drift = daysBetween(base, realToday);
  if (drift > 0) {
    $("stale").className = "stale on";
    $("stale").innerHTML =
      "<b>" + drift + (drift === 1 ? " day" : " days") + " old</b>" +
      "<span>This board was built for " + esc(DATA.today.label) +
      ". Countdowns below are counted from that morning.</span>";
  }

  /* ---- masthead ---- */
  const hour = now.getHours();
  const salute = hour < 5 ? "Still up" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  $("greeting").innerHTML = esc(salute) + ", <em>" + esc(DATA.owner) + "</em>.";
  $("eyebrow").innerHTML = [
    esc(DATA.today.label),
    "Week " + DATA.today.weekNumber,
    esc(DATA.tz)
  ].map(s => "<span>" + s + "</span>").join('<span class="dot">/</span>');

  function renderCounters(counters) {
    $("counters").innerHTML = counters.map(c =>
      '<div class="counter tone-' + esc(c.tone) + '">' +
        '<span class="n">' + esc(c.value) + "</span>" +
        '<span class="l">' + esc(c.label) + "</span>" +
        (c.note ? '<span class="s">' + esc(c.note) + "</span>" : "") +
      "</div>"
    ).join("");
  }
  renderCounters(DATA.counters);

  $("briefing").innerHTML = DATA.briefing;   // trusted: written by the briefing agent

  /* ---- schedule ---- */
  function renderSchedule(days) {
  const totalEvents = days.reduce((n, d) => n + d.events.length, 0);
  $("sched-meta").textContent = totalEvents + (totalEvents === 1 ? " event" : " events");

  $("days").innerHTML = days.map(day => {
    const head =
      '<div class="dayhead"><h3>' + esc(day.label) + "</h3>" +
      '<span class="cnt">' + (day.events.length || "—") + "</span></div>";

    if (!day.events.length) {
      return '<div class="day">' + head +
        '<p class="empty">' + esc(day.emptyNote || "Nothing scheduled.") + "</p></div>";
    }

    const rows = day.events.map(ev => {
      const bits = [];
      if (ev.where) {
        bits.push(ev.link
          ? '<a href="' + esc(ev.link) + '" target="_blank" rel="noopener">' + esc(ev.where) + "</a>"
          : esc(ev.where));
      }
      if (ev.with) bits.push(esc(ev.with));

      const chips = [];
      if (ev.calendar) chips.push('<span class="chip">' + esc(ev.calendar) + "</span>");
      if (ev.rsvp === "needsAction") chips.push('<span class="chip crit">no reply yet</span>');
      if (ev.rsvp === "accepted") chips.push('<span class="chip ok">accepted</span>');
      if (ev.rsvp === "organizer") chips.push('<span class="chip acc">you organise</span>');

      return '<li class="' + (ev.conflict ? "is-conflict" : "") + '">' +
          '<div class="time">' + esc(ev.start) + "<span>" + esc(ev.end) + "</span></div>" +
          '<div class="rail"></div>' +
          '<div class="what">' +
            '<div class="t">' + esc(ev.title) + "</div>" +
            (bits.length ? '<div class="d">' + bits.join(" · ") + "</div>" : "") +
            (chips.length ? '<div class="chips">' + chips.join("") + "</div>" : "") +
            (ev.conflictNote ? '<div class="note">' + esc(ev.conflictNote) + "</div>" : "") +
          "</div>" +
        "</li>";
    }).join("");

    return '<div class="day">' + head + '<ul class="tl">' + rows + "</ul></div>";
  }).join("");
  }
  renderSchedule(DATA.days);

  /* ---- priorities ---- */
  $("pri").innerHTML = DATA.priorities.map(p => {
    const d = daysBetween(base, p.due);
    const when = d < 0 ? "overdue" : d === 0 ? "today" : d === 1 ? "tomorrow" : "in " + d + "d";
    return '<li class="p' + p.pri + '">' +
        '<span class="box"></span>' +
        '<span class="txt">' + esc(p.text) +
          (p.tag ? ' <span class="chip">' + esc(p.tag) + "</span>" : "") +
        "</span>" +
        '<span class="when">' + when + "</span>" +
      "</li>";
  }).join("");

  /* ---- ledger ---- */
  const ICONS = {
    mail:  '<path d="M2 4h12v8H2z"/><path d="M2.4 4.6L8 8.6l5.6-4"/>',
    reply: '<path d="M6.8 3.2L2 7.6l4.8 4.4"/><path d="M2.6 7.6H10a4 4 0 0 1 4 4v1.2"/>',
    event: '<rect x="2" y="3.2" width="12" height="10.8" rx="1"/><path d="M2 6.6h12M5.4 1.6v3M10.6 1.6v3"/>',
    map:   '<path d="M8 14.2s4.4-4.3 4.4-7.5a4.4 4.4 0 1 0-8.8 0C3.6 9.9 8 14.2 8 14.2z"/><circle cx="8" cy="6.6" r="1.6"/>',
    web:   '<path d="M9.5 3.5h3v3"/><path d="M12.5 3.5L7.4 8.6"/><path d="M12 9.6v2.9H3.2V3.6h2.9"/>'
  };
  const icon = k => '<svg viewBox="0 0 16 16" aria-hidden="true">' + (ICONS[k] || ICONS.web) + "</svg>";

  $("ledger").innerHTML = DATA.deadlines
    .slice()
    .sort((a, b) => toUTC(a.date) - toUTC(b.date))
    .map(x => {
      const d = daysBetween(base, x.date);
      const cls = d <= 1 ? "d-now" : d <= 7 ? "d-soon" : "d-far";  // d<0 lands in d-now
      // Overdue reads as "2 days late", never a bare negative number.
      const label = d < 0 ? (d === -1 ? "day late" : "days late")
                  : d === 0 ? "today" : d === 1 ? "day" : "days";
      const num = d < 0 ? String(-d) : (x.startedToday && d === 0 ? "now" : String(d));
      return "<tr>" +
          '<td><div class="title">' + esc(x.title) +
            (x.unverified ? ' <span class="chip warn">confirm date</span>' : "") +
          "</div>" +
          (x.detail ? '<div class="det">' + esc(x.detail) + "</div>" : "") +
          (x.actions && x.actions.length
            ? '<div class="acts">' + x.actions.map(a =>
                '<a class="act" href="' + esc(a.href) + '" target="_blank" rel="noopener">' +
                  icon(a.icon) + "<span>" + esc(a.label) + "</span>" +
                "</a>").join("") + "</div>"
            : "") +
          "</td>" +
          '<td class="num d ' + cls + '">' + esc(num) + "<small>" + esc(label) + "</small></td>" +
        "</tr>";
    }).join("");

  /* ---- needs you ---- */
  $("needs-meta").textContent = DATA.needsYou.length + " open";
  $("needs").innerHTML = DATA.needsYou.map(n =>
    '<li class="sev-' + esc(n.severity) + '">' +
      '<span class="stripe"></span>' +
      "<div>" +
        '<div class="what">' + esc(n.what) + "</div>" +
        '<div class="why">' + esc(n.why) + "</div>" +
        '<div class="src">' + esc(n.source) + "</div>" +
      "</div>" +
    "</li>"
  ).join("");

  /* ---- week ---- */
  $("week-meta").textContent = DATA.weekAhead.length + " days";
  $("week").innerHTML = DATA.weekAhead.map(d =>
    '<li class="' + (d.items.length ? "busy" : "") + '">' +
      '<span class="dd">' + esc(d.label) + "</span>" +
      (d.items.length
        ? "<ul>" + d.items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>"
        : '<span class="none">clear</span>') +
    "</li>"
  ).join("");

  /* ---- inbox ---- */
  function renderInbox(inbox) {
    $("inbox-meta").textContent = inbox.unreadEstimate + " " + inbox.windowLabel;
    $("mail").innerHTML = inbox.threads.map(t =>
      '<li class="f-' + esc(t.flag) + '">' +
        '<span class="from">' + esc(t.from) + "</span>" +
        '<span class="when">' + esc(t.when) +
          (t.isNew ? ' <span class="chip warn">new</span>' : "") + "</span>" +
        '<span class="subj">' + esc(t.subject) + "</span>" +
      "</li>"
    ).join("");
  }
  renderInbox(DATA.inbox);

  /* ---- footer ---- */
  const gen = DATA.generatedAt.replace("T", " ").slice(0, 16);
  $("foot").innerHTML = [
    "Built " + esc(gen) + " " + esc(DATA.tz),
    "Sources: " + DATA.sources.map(esc).join(" · "),
    "Rebuilds every morning at 07:55"
  ].map(s => "<span>" + s + "</span>").join("");

  /* ================= Live refresh + task box ==================
     Everything below is progressive: if the mcp capability isn't granted,
     nothing here runs and the page stays exactly as it was published. */

  const SVG = {
    refresh: '<path d="M13.4 8a5.4 5.4 0 1 1-1.6-3.8"/><path d="M13.7 2.3v3.2h-3.2"/>',
    open:    '<path d="M9.5 3.5h3v3"/><path d="M12.5 3.5L7.4 8.6"/><path d="M12 9.6v2.9H3.2V3.6h2.9"/>',
    send:    '<path d="M14 2L7 9"/><path d="M14 2l-4.5 12-2.5-5-5-2.5L14 2z"/>'
  };
  const bicon = k => '<svg viewBox="0 0 16 16" aria-hidden="true">' + SVG[k] + "</svg>";
  const pad2 = n => String(n).padStart(2, "0");
  const hhmm = ms => { const d = new Date(ms); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const addDays = (iso, n) => new Date(toUTC(iso) + n * 86400000).toISOString().slice(0, 10);
  const prettyDay = iso => {
    const d = new Date(toUTC(iso));
    return DOW[d.getUTCDay()] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()];
  };

  // "Full rebuild" needs no capability — it's just a link to the session.
  $("tools").innerHTML =
    '<a class="btn" href="' + esc(DATA.sessionUrl) + '" target="_blank" rel="noopener">' +
      bicon("open") + "<span>Full rebuild</span></a>";

  /* Each error code has a different correct fix — never one generic banner. */
  function errCopy(e, kind) {
    const code = (e && e.code) || "upstream_error";
    const who = (e && e.server) || "the connector";
    // A failed WRITE is an ambiguous outcome — the mail may still have gone out.
    // Never tell him to just send again; that risks queueing the task twice.
    if (kind === "write" && (code === "server_unavailable" || code === "upstream_error" || code === "cancelled")) {
      return { t: "Not sure it sent", m: "Gmail didn't confirm. Check your Sent mail before queueing this again." };
    }
    switch (code) {
      case "needs_reauth":
        return { t: "Reconnect " + who, m: "Its access expired. Reconnect it in claude.ai → Settings → Connectors, then refresh." };
      case "server_not_connected":
        return { t: who + " isn't connected", m: "Add it in claude.ai → Settings → Connectors." };
      case "selection_required":
        return { t: "Pick a " + who + " account", m: "You have more than one. Choose when claude.ai asks, then refresh." };
      case "server_not_found":
        return { t: who + " no longer exists", m: "The connector was removed upstream." };
      case "server_unavailable":
        return { t: "Google didn't answer", m: "Temporary — try Refresh again in a moment." };
      case "not_in_manifest":
        return { t: "Not permitted here", m: "This page didn't ask for that tool." };
      case "blocked_by_policy":
        return { t: "Blocked by policy", m: "Your organisation blocks this tool." };
      case "approval_required":
        return { t: "Needs approval", m: "Per-call approval isn't supported in pages yet." };
      case "tool_error":
        return { t: "Rejected by " + who, m: (e && e.message) || "It reported a failure." };
      case "rate_limited":
        return { t: "Too many requests", m: "Wait a few seconds, then refresh." };
      case "not_granted":
      case "capability_disabled":
      case "capability_removed":
        return { t: "Live data is off here", m: "Open the page from claude.ai to use Refresh." };
      default:
        return { t: "Couldn't load", m: (e && e.message) || "Unknown failure." };
    }
  }
  const showErr = (id, e) => {
    const c = errCopy(e);
    $(id).innerHTML = '<div class="err"><b>' + esc(c.t) + "</b>" + esc(c.m) + "</div>";
  };
  const clearErr = id => { $(id).innerHTML = ""; };

  const LIVE = { days: null, inbox: null };

  (async function initLive() {
    let mcp = null;
    try { mcp = typeof claude !== "undefined" ? await claude.use("mcp") : null; } catch (_) { mcp = null; }
    if (!mcp) return;   // no live features — the published board stands on its own

    /* Reads may retry once, and only when the runtime stamped them retryable. */
    async function read(server, tool, input) {
      try {
        return await mcp.callTool(server, tool, input, { cache: { refresh: true } });
      } catch (e) {
        if (e && e.retryable) {
          const wait = Math.min(e.retryAfterMs || 1200, 60000) + Math.random() * 400;
          await new Promise(r => setTimeout(r, wait));
          return await mcp.callTool(server, tool, input, { cache: { refresh: true } });
        }
        throw e;
      }
    }

    const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const clock = x => { const m = x && x.dateTime && /T(\d{2}:\d{2})/.exec(x.dateTime); return m ? m[1] : null; };

    function buildDays(cals) {
      return [0, 1].map(offset => {
        const date = addDays(DATA.today.date, offset);
        const evs = [];
        cals.forEach(c => (c.events || []).forEach(ev => {
          if (ev.status === "cancelled") return;
          const s = ev.start || {}, e = ev.end || {};
          const key = (s.dateTime || s.date || "").slice(0, 10);
          if (key !== date) return;
          const start = clock(s);
          if (!start) return;               // all-day items live in the ledger, not the timeline
          // On a shared calendar (KOZALAK) `self` marks the calendar, not him —
          // so match his address too, or he shows up in his own guest list.
          const mine = a => a.self || (a.email || "").toLowerCase() === DATA.ownerEmail.toLowerCase();
          const me = (ev.attendees || []).find(mine);
          evs.push({
            start,
            end: clock(e) || "",
            title: ev.summary || "(no title)",
            calendar: c.label,
            where: ev.conferenceUrl ? ev.conferenceUrl.replace(/^https?:\/\//, "")
                 : (ev.location && !/^https?:/i.test(ev.location) ? ev.location : null),
            link: ev.conferenceUrl || (/^https?:/i.test(ev.location || "") ? ev.location : null),
            with: (ev.attendees || []).filter(a => !mine(a) && (a.displayName || a.email))
                    .map(a => a.displayName || prettyFrom(a.email)).slice(0, 4).join(", ") || null,
            rsvp: (ev.organizer && ev.organizer.self) ? "organizer" : (me ? me.responseStatus : null)
          });
        }));
        evs.sort((a, b) => toMin(a.start) - toMin(b.start));
        for (let i = 0; i < evs.length; i++) {
          for (let j = i + 1; j < evs.length; j++) {
            const A = evs[i], B = evs[j];
            if (!A.end || !B.end) continue;
            if (toMin(B.start) < toMin(A.end) && toMin(A.start) < toMin(B.end)) {
              A.conflict = true; B.conflict = true;
              B.conflictNote = "Overlaps “" + A.title + "” at " + A.start + ".";
            }
          }
        }
        return {
          date,
          label: (offset === 0 ? "Today · " : "Tomorrow · ") + prettyDay(date),
          events: evs,
          emptyNote: offset === 0 ? "Nothing left on the calendar today." : "Nothing scheduled."
        };
      });
    }

    // Personal-mail domains carry no brand — the local part is the useful name.
    const FREEMAIL = ["gmail","googlemail","outlook","hotmail","yahoo","icloud","proton","protonmail","yandex"];
    // Sending subdomains that say nothing about who sent it.
    const NOISE = ["mail","email","e","smtp","mailer","noreply","no-reply","notifications","notification","ileti","bilgilendirme","info"];
    const titled = s => s.charAt(0).toUpperCase() + s.slice(1);

    function prettyFrom(s) {
      const named = /^\s*"?([^"<]+?)"?\s*<.+>\s*$/.exec(s || "");
      if (named) return named[1].trim();
      const at = (s || "").indexOf("@");
      if (at < 0) return s || "(unknown)";
      const local = s.slice(0, at);
      const labels = s.slice(at + 1).toLowerCase().split(".");
      if (FREEMAIL.indexOf(labels[0]) !== -1) return local;          // a person, not a brand
      const brand = labels.find(l => NOISE.indexOf(l) === -1) || labels[0];
      return titled(brand);
    }
    function whenLabel(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      const t = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      const ymd = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      const diff = daysBetween(ymd, realToday);
      if (diff === 0) return "today " + t;
      if (diff === 1) return "yesterday " + t;
      return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()] + " " + t;
    }
    function buildInbox(payload) {
      const seen = new Map(DATA.inbox.threads.map(t => [t.id, t.flag]));
      const muted = DATA.live.muteSenders.map(x => x.toLowerCase());
      const threads = (payload.threads || []).map(t => {
        const msgs = t.messages || [];
        const m = msgs[msgs.length - 1] || {};
        return { id: t.id, sender: m.sender || "", subject: m.subject || "(no subject)", date: m.date };
      })
      .filter(t => !muted.some(x => t.sender.toLowerCase().indexOf(x) !== -1))
      .slice(0, 9)
      .map(t => ({
        id: t.id,
        from: prettyFrom(t.sender),
        subject: t.subject,
        when: whenLabel(t.date),
        flag: seen.get(t.id) || "watch",
        isNew: !seen.has(t.id)
      }));
      return {
        unreadEstimate: payload.resultCountEstimate || threads.length,
        windowLabel: DATA.inbox.windowLabel,
        threads
      };
    }

    let noted = false;
    function noteMorningPanels() {
      if (noted) return;
      noted = true;
      const n = document.createElement("p");
      n.className = "secnote";
      n.style.margin = "0";
      n.textContent = "Schedule and inbox are live. The written briefing, Needs you, the ledger and " +
                      "priorities still date from this morning — use Full rebuild to regenerate those.";
      $("briefing").insertAdjacentElement("afterend", n);
    }

    async function refresh() {
      const btn = $("btn-refresh");
      btn.disabled = true; btn.classList.add("busy");
      let scheduleOk = false;

      const from = DATA.today.date + "T00:00:00+03:00";
      const to = addDays(DATA.today.date, 2) + "T00:00:00+03:00";
      const cals = await Promise.all(DATA.live.calendars.map(c =>
        read("Google Calendar", "list_events", {
          calendarId: c.id, startTime: from, endTime: to,
          orderBy: "startTime", timeZone: DATA.tz, pageSize: 50
        })
        .then(r => ({ label: c.label, events: (r.payload && r.payload.events) || [], cache: r.cache }))
        .catch(e => ({ label: c.label, error: e }))
      ));
      const okCals = cals.filter(c => !c.error);
      if (!okCals.length) {
        showErr("sched-err", cals[0].error);
      } else {
        const days = buildDays(okCals);
        LIVE.days = days;
        renderSchedule(days);
        scheduleOk = true;
        const failed = cals.filter(c => c.error);
        if (failed.length) showErr("sched-err", failed[0].error); else clearErr("sched-err");
        const cached = okCals.find(c => c.cache && c.cache.storedAt);
        $("sched-stamp").textContent = "live " + hhmm(cached ? cached.cache.storedAt : Date.now());
      }

      try {
        const r = await read("Gmail", "search_threads", {
          query: DATA.live.inboxQuery, pageSize: 25
        });
        const inbox = buildInbox(r.payload || {});
        LIVE.inbox = inbox;
        renderInbox(inbox);
        clearErr("inbox-err");
        $("inbox-stamp").textContent = "live " + hhmm(r.cache && r.cache.storedAt ? r.cache.storedAt : Date.now());
      } catch (e) {
        showErr("inbox-err", e);
      }

      if (scheduleOk) {
        const counters = DATA.counters.map(c => Object.assign({}, c));
        const n = LIVE.days[0].events.length;
        counters[0].value = n;
        counters[0].note = n ? "live from your calendars" : "nothing left today";
        counters[0].tone = n ? "warn" : "clear";
        renderCounters(counters);
        noteMorningPanels();
      }

      btn.disabled = false; btn.classList.remove("busy");
    }

    /* ---- task box: queues an edit to tasks.md as structured mail ---- */
    function taskFields(op) {
      if (op === "add") {
        return '<div class="tb-row">' +
            '<input type="text" id="tb-text" placeholder="What needs doing?" autocomplete="off">' +
          "</div>" +
          '<div class="tb-row">' +
            '<input type="date" id="tb-due" aria-label="Due date">' +
            '<select id="tb-pri" class="pri-sel" aria-label="Priority">' +
              '<option value="2">Normal</option><option value="1">Urgent</option><option value="3">Someday</option>' +
            "</select>" +
            '<input type="text" id="tb-tag" placeholder="#tag" autocomplete="off">' +
          "</div>";
      }
      const opts = DATA.priorities.map(p => '<option value="' + esc(p.text) + '">' + esc(p.text) + "</option>").join("");
      return '<div class="tb-row"><select id="tb-pick" aria-label="Which task">' + opts + "</select></div>";
    }

    let op = "add";
    $("taskbox-panel").hidden = false;
    $("taskbox").innerHTML =
      '<div class="seg" id="tb-seg">' +
        '<button type="button" data-op="add" aria-pressed="true">Add</button>' +
        '<button type="button" data-op="done" aria-pressed="false">Mark done</button>' +
        '<button type="button" data-op="remove" aria-pressed="false">Remove</button>' +
      "</div>" +
      '<div id="tb-fields">' + taskFields("add") + "</div>" +
      '<div class="tb-row"><button class="btn" type="button" id="tb-send">' + bicon("send") + "<span>Queue it</span></button></div>" +
      '<div class="tb-status" id="tb-status"></div>' +
      '<div class="tb-hint">Sends a structured mail to yourself. The next rebuild applies it to tasks.md and trashes the mail.</div>';

    $("tb-seg").addEventListener("click", ev => {
      const b = ev.target.closest("button[data-op]");
      if (!b) return;
      op = b.dataset.op;
      [...$("tb-seg").children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("tb-fields").innerHTML = taskFields(op);
      $("tb-status").textContent = "";
    });

    $("tb-send").addEventListener("click", async () => {
      const status = $("tb-status"), btn = $("tb-send");
      let subject, body, label;
      if (op === "add") {
        const text = ($("tb-text").value || "").trim();
        if (!text) { status.className = "tb-status bad"; status.textContent = "Write the task first."; return; }
        const due = $("tb-due").value, pri = $("tb-pri").value, tag = ($("tb-tag").value || "").trim();
        label = text;
        subject = "[dash] add: " + text;
        body = ["op: add", "task: " + text, "priority: " + pri,
                "due: " + (due || ""), "tags: " + tag, "",
                "Queued from the dashboard task box."].join("\n");
      } else {
        const pick = $("tb-pick");
        if (!pick || !pick.value) { status.className = "tb-status bad"; status.textContent = "Pick a task first."; return; }
        label = pick.value;
        subject = "[dash] " + op + ": " + pick.value;
        body = ["op: " + op, "task: " + pick.value, "", "Queued from the dashboard task box."].join("\n");
      }

      btn.disabled = true;
      status.className = "tb-status";
      status.textContent = "Queueing…";
      try {
        // A write: never cached, never auto-retried.
        await mcp.callTool("Gmail", "send_message", {
          to: [DATA.ownerEmail], subject: subject, body: body
        });
        status.className = "tb-status ok";
        status.textContent = "Queued. It lands in tasks.md at the next rebuild.";
        if (op === "add") {
          const li = document.createElement("li");
          li.className = "pending";
          li.innerHTML = '<span class="box"></span><span class="txt">' + esc(label) +
            ' <span class="chip pend">queued</span></span><span class="when">pending</span>';
          $("pri").appendChild(li);
          $("tb-text").value = "";
        }
      } catch (e) {
        const c = errCopy(e, "write");
        status.className = "tb-status bad";
        status.textContent = c.t + " — " + c.m;
      } finally {
        btn.disabled = false;
      }
    });

    /* Refresh button only exists once we know the capability is live. */
    $("tools").insertAdjacentHTML("afterbegin",
      '<button class="btn" type="button" id="btn-refresh">' + bicon("refresh") + "<span>Refresh</span></button>");
    $("btn-refresh").addEventListener("click", refresh);
  })();
})();
</script>
