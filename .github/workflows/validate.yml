name: Validate package

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synchronized package metadata
        run: python3 scripts/validate-package.py

  discovery:
    runs-on: ubuntu-latest
    # Network-dependent checks; keep them separate so a registry hiccup does not
    # mask a real metadata failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Agent Skills discovery
        run: npx --yes skills add . --list
      - name: Validate Claude Code plugin manifest
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
